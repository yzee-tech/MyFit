name: CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-environment
      - name: Run ESLint and Prettier Check
        run: pnpm lint

  svelte_check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-environment
      - name: Run Svelte Check
        run: pnpm check

  # The browser tests run as parallel shards, each with its own runner and its own database: Playwright
  # splits the suite by test (fullyParallel), so there is no list of files to keep up to date. The shard
  # count is the number of entries in the matrix below.
  playwright_shard:
    env:
      MONGODB_URI: ${{ secrets.MONGODB_URI }}
    # A version Playwright installs its browser's libraries on (ubuntu-latest is moving to 26)
    runs-on: ubuntu-24.04
    # A hang fails here, not after GitHub's six hours
    timeout-minutes: 30
    strategy:
      # Every shard finishes, so one failing does not hide the other's result
      fail-fast: false
      matrix:
        shard: [1, 2]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: myfit
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-environment

      - name: Set DATABASE_URL
        run: echo "DATABASE_URL=postgresql://postgres:postgres@localhost:5432/myfit" >> $GITHUB_ENV

      # The migrations, as production runs them (not db push, which skips them)
      - name: Initialize database schema
        run: pnpm exec prisma migrate deploy

      - name: Generate AUTH_SECRET
        run: echo "AUTH_SECRET=$(openssl rand -base64 33)" >> $GITHUB_ENV

      # Chromium only (the one project the tests use), kept between runs until Playwright changes
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Playwright Browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        timeout-minutes: 10
        run: pnpm exec playwright install --with-deps chromium

      - name: Install Playwright system libraries
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        timeout-minutes: 10
        run: pnpm exec playwright install-deps chromium

      - name: Verify first-failure capture, retry summary and privacy boundary
        run: |
          node --test tests/diagnostics/capture.test.cjs
          node --test tests/diagnostics/retried-tests-summary.test.cjs

      # Fails in about a minute, before the long run, if the shards would drop or double a test
      - name: Check the shards together run every test once
        run: bash tests/diagnostics/shard-coverage.sh ${{ matrix.shard }} ${{ strategy.job-total }}

      - name: Run Playwright tests (shard ${{ matrix.shard }} of ${{ strategy.job-total }})
        run: pnpm exec playwright test --shard=${{ matrix.shard }}/${{ strategy.job-total }}

      # This directory contains strict-schema JSON only, never raw test-results/auth/trace/video.
      - name: Validate safe failure evidence
        id: safe_evidence
        if: always()
        run: node tests/diagnostics/safe-artifacts.cjs playwright-diagnostics

      # Lists each test that needed a retry in the run's summary, so flakes are visible without opening logs.
      # Runs only when the privacy boundary above succeeded, and the script re-validates each record
      # with the same strict validator before rendering it; it collects nothing new.
      - name: Summarize retried tests
        if: ${{ always() && steps.safe_evidence.outcome == 'success' }}
        run: node tests/diagnostics/retried-tests-summary.cjs playwright-diagnostics

      - name: Upload safe Playwright evidence
        uses: actions/upload-artifact@v4
        if: ${{ always() && steps.safe_evidence.outcome == 'success' }}
        with:
          name: playwright-safe-evidence-${{ matrix.shard }}
          path: playwright-diagnostics/
          if-no-files-found: error
          retention-days: 7

  # The check pull requests have always had to pass, under its old name: it passes only when every shard
  # did (a failed, skipped or cancelled shard fails it), so gating on it needs no change
  playwright_tests:
    needs: playwright_shard
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require every Playwright shard to have passed
        env:
          SHARDS_RESULT: ${{ needs.playwright_shard.result }}
        run: |
          echo "Playwright shards: $SHARDS_RESULT"
          test "$SHARDS_RESULT" = "success"
